name: Claim Review Globally

on:
  workflow_dispatch:
    inputs:
      review_id:
        description: 'Review ID to mark as used (e.g. rev_001)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  claim-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Mark Review as Claimed
        run: |
          node -e "
            const fs = require('fs');
            const file = 'data/reviews.json';
            const reviews = JSON.parse(fs.readFileSync(file, 'utf8'));
            const targetId = '${{ github.event.inputs.review_id }}';
            let found = false;
            for (const r of reviews) {
              if (r.id === targetId) {
                r.used = true;
                r.claimedAt = new Date().toISOString();
                found = true;
                break;
              }
            }
            if (found) {
              fs.writeFileSync(file, JSON.stringify(reviews, null, 2), 'utf8');
              console.log('✓ Successfully claimed review ' + targetId);
            } else {
              console.log('Review ' + targetId + ' not found or already processed.');
            }
          "

      - name: Re-generate Bundled Assets
        run: |
          npm install
          node scripts/generate_qr_assets.mjs

      - name: Commit & Push Update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/reviews.json public/assets/data-bundle.js
          git commit -m "chore(reviews): claim review ${{ github.event.inputs.review_id }} [skip ci]" || echo "No changes"
          git push origin main
