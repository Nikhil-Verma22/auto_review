name: Replenish SEO Reviews Pool

on:
  schedule:
    - cron: '0 0 * * 1' # Runs every Monday at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replenish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Run Review Replenishment Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/replenish_reviews.mjs

      - name: Commit Replenished Pool & Assets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/reviews.json public/assets/data-bundle.js
          git commit -m "chore(reviews): replenish pool with fresh SEO reviews [skip ci]" || echo "No changes"
          git push origin main
